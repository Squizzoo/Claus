<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'self'; script-src 'self'; img-src 'self' data:">
  <title>Claus</title>
  <link rel="stylesheet" href="pet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="root" class="pet-host side-right up mood-sleep">
    <section id="panel" aria-label="Claude chats" hidden>
      <div id="card">
        <header><span>Claude chats</span><span id="count"></span></header>
        <div id="tools">
          <input id="search" type="text" placeholder="Search chats  ( / )" aria-label="Search chats" autocomplete="off" spellcheck="false">
          <button id="opts-toggle" type="button" title="View options" aria-label="View options" aria-expanded="false">⋯</button>
        </div>
        <div id="opts" hidden>
          <button type="button" data-opt="groupBy"></button>
          <button type="button" data-opt="sort"></button>
          <button type="button" data-opt="density"></button>
        </div>
        <ul id="list"></ul>
        <p id="empty" hidden>No chats are open right now.</p>
        <footer id="footer" hidden>
          <div id="undo-bar" hidden><span id="undo-text"></span><button type="button" id="undo">Undo</button></div>
          <div id="bulk">
            <button type="button" id="clear-done"></button>
            <button type="button" id="clear-idle"></button>
            <button type="button" id="unhide"></button>
          </div>
        </footer>
      </div>
    </section>

    <div id="pet" role="button" tabindex="0" aria-label="Claus">
      <div id="badge" hidden>0</div>
      <div id="chips"></div>
      <div id="confetti"></div>
      <svg viewBox="0 0 150 150" width="150" height="150" aria-hidden="true">
        <ellipse id="shadow" cx="75" cy="139" rx="34" ry="5.5"/>
        <g id="bob" class="bob">
          <g id="tilt" class="tilt"></g>
        </g>

        <g id="vein-pos"><g id="vein"><path d="M68 30 q6 1 6 7 M82 30 q-6 1 -6 7 M68 46 q6 -1 6 -7 M82 46 q-6 -1 -6 -7"/></g></g>

        <g id="bubble">
          <path id="bubble-shape" d="M98 8 h38 a8 8 0 0 1 8 8 v20 a8 8 0 0 1 -8 8 h-26 l-8 8 v-8 h-4 a8 8 0 0 1 -8 -8 v-20 a8 8 0 0 1 8 -8 z"/>
          <text id="bubble-text" x="117" y="35" text-anchor="middle">?</text>
        </g>
      </svg>
    </div>
  </div>
  <script src="view.js"></script>
  <script src="pets.js"></script>
  <script src="sounds.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
